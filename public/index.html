<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AUIS — Academic Resource Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    :root {
      --navy: #1e3a8a;
      --navy-dark: #162d6e;
      --navy-light: #2d4fa8;
      --slate: #64748b;
      --slate-light: #94a3b8;
      --accent: #f59e0b;
      --accent-light: #fcd34d;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #1e293b; }

    #sidebar {
      width: 260px; min-height: 100vh; background: var(--navy);
      position: fixed; left: 0; top: 0; z-index: 100;
      display: flex; flex-direction: column;
      transition: transform 0.3s ease;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: #fff; letter-spacing: -0.5px;
    }
    .sidebar-logo span { color: var(--accent-light); }
    .sidebar-logo p { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }

    .nav-section { padding: 16px 12px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 8px; cursor: pointer;
      color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500;
      transition: all 0.15s ease; margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; }

    .sidebar-footer { margin-top: auto; padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.07); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #1e293b; }

    #main { margin-left: 260px; min-height: 100vh; padding: 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #0f172a; }

    /* Toasts */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #fff; border-radius: 10px; padding: 14px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-left: 4px solid; font-size: 14px; animation: slideIn 0.3s ease; min-width: 280px; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--error); }
    .toast.info { border-color: var(--navy); }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Grid & Materials */
    .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .material-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 20px; transition: 0.2s; }
    .material-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

    /* Chat UI */
    #chat-page { height: calc(100vh - 180px); display: flex; flex-direction: column; background: #fff; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-bubble { display: flex; gap: 10px; max-width: 80%; }
    .msg-bubble.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-text { background: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; }
    .msg-bubble.mine .msg-text { background: var(--navy); color: #fff; }

    /* Auth Screen */
    #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-dark); }
    .auth-card { background: #fff; border-radius: 20px; width: 400px; padding: 32px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--slate); }
    .auth-tab.active { color: var(--navy); border-bottom: 2px solid var(--navy); font-weight: 600; }

    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: var(--navy-dark); }
    .form-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); outline: none; margin-bottom: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="toast-container"></div>

<div id="auth-screen">
  <div class="auth-card">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-navy">Nexus <span class="text-amber-500">AUIS</span></h2>
        <p class="text-xs text-slate-400 uppercase tracking-widest">Academic Hub</p>
    </div>
    <div class="auth-tabs">
      <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</div>
      <div id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Register</div>
    </div>

    <div id="login-form">
      <input id="login-email" class="form-input" type="email" placeholder="you@auis.edu.krd" />
      <input id="login-password" class="form-input" type="password" placeholder="Password" />
      <button class="btn btn-primary w-full" onclick="login()">Sign In</button>
    </div>

    <div id="register-form" class="hidden">
      <input id="reg-name" class="form-input" type="text" placeholder="Full Name" />
      <input id="reg-email" class="form-input" type="email" placeholder="you@auis.edu.krd" />
      <input id="reg-password" class="form-input" type="password" placeholder="Password" />
      <select id="reg-major" class="form-input">
        <option value="IT">IT</option><option value="SE">SE</option><option value="CS">CS</option><option value="Business">Business</option>
      </select>
      <button class="btn btn-primary w-full" onclick="register()">Create Account</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sidebar-logo"><h1>Nexus <span>AUIS</span></h1></div>
    <div class="nav-section">
      <div id="nav-dashboard" class="nav-item active" onclick="navigate('dashboard')">🏠 Dashboard</div>
      <div id="nav-chat" class="nav-item" onclick="navigate('chat')">💬 Live Chat</div>
      <div id="nav-upload" class="nav-item" onclick="navigate('upload')">⬆️ Upload</div>
      <div class="nav-item text-red-400 mt-10" onclick="logout()">Logout</div>
    </div>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <p id="sidebar-name" class="text-white text-sm font-bold">User</p>
          <span id="sidebar-major" class="text-slate-400 text-xs">Major</span>
        </div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="page-dashboard">
      <h1 class="page-title mb-6">Academic Dashboard</h1>
      <div id="dashboard-recent" class="materials-grid">
          </div>
    </div>

    <div id="page-chat" class="hidden">
      <h1 class="page-title mb-6">Live Chat</h1>
      <div id="chat-page">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="p-4 border-t flex gap-2">
          <input id="chat-input" class="form-input mb-0" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="btn btn-primary px-6" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <div id="page-upload" class="hidden">
      <h1 class="page-title mb-6">Upload Resource</h1>
      <div class="bg-white p-8 rounded-xl border max-w-lg">
        <label class="block text-sm font-medium mb-2">Resource Title</label>
        <input id="upload-title" class="form-input" type="text" placeholder="e.g. CS301 Lecture Notes" />
        <input type="file" id="file-input" class="mb-6 block w-full text-sm text-slate-500" />
        <button class="btn btn-primary w-full" onclick="uploadFile()">Upload to Cloud</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://noora-adnan.vercel.app"; 
  const PUSHER_KEY = "c13e5901d85bfa53ba80"; 
  const PUSHER_CLUSTER = "mt1";

  let currentUser = JSON.parse(localStorage.getItem("nexus_user"));
  let token = localStorage.getItem("nexus_token");

  // Pusher Init
  const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
  const channel = pusher.subscribe('general');
  channel.bind('new-message', data => appendMessage(data));

  // Auth
  async function login() {
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    try {
      const res = await fetch(`${API_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem("nexus_token", data.token);
        localStorage.setItem("nexus_user", JSON.stringify(data.user));
        window.location.reload();
      } else { showToast(data.error || "Login failed", "error"); }
    } catch (err) { showToast("Server error", "error"); }
  }

  async function register() {
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      const major = document.getElementById("reg-major").value;
      try {
          const res = await fetch(`${API_URL}/api/auth/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password, major })
          });
          const data = await res.json();
          if (res.ok) {
              showToast("Account created! Please sign in.", "success");
              switchAuthTab('login');
          } else { showToast(data.error, "error"); }
      } catch (err) { showToast("Registration failed", "error"); }
  }

  function logout() { localStorage.clear(); window.location.reload(); }

  // Chat
  async function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text || !currentUser) return;

    try {
        await fetch(`${API_URL}/api/chat/send`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}` 
            },
            body: JSON.stringify({ text, room: "general", userName: currentUser.name })
        });
        input.value = "";
    } catch (err) { showToast("Message failed", "error"); }
  }

  function appendMessage(data) {
    const container = document.getElementById("chat-messages");
    const isMine = currentUser && data.userName === currentUser.name;
    container.innerHTML += `
      <div class="msg-bubble ${isMine ? 'mine' : ''}">
        <div class="msg-text">
            <div class="text-[10px] opacity-50 font-bold uppercase mb-1">${data.userName}</div>
            ${data.text}
        </div>
      </div>`;
    container.scrollTop = container.scrollHeight;
  }

  // Materials
  async function loadDashboard() {
      try {
          const res = await fetch(`${API_URL}/api/materials`);
          const data = await res.json();
          const container = document.getElementById("dashboard-recent");
          container.innerHTML = data.materials.map(m => `
              <div class="material-card">
                  <div class="text-xs text-amber-600 font-bold mb-1">RESOURCE</div>
                  <h3 class="font-bold text-lg mb-4">${m.title}</h3>
                  <a href="${m.fileUrl}" target="_blank" class="btn btn-primary w-full text-sm">Download File</a>
              </div>
          `).join('');
      } catch (err) { showToast("Failed to load materials", "error"); }
  }

  async function uploadFile() {
    const fileInput = document.getElementById("file-input");
    const title = document.getElementById("upload-title").value;
    if (!fileInput.files[0] || !title) return showToast("Title and file required", "error");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("title", title);

    showToast("Uploading to Cloud...", "info");
    try {
        const res = await fetch(`${API_URL}/api/materials`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` },
            body: formData
        });
        if (res.ok) {
            showToast("Success!", "success");
            navigate('dashboard');
        }
    } catch (err) { showToast("Upload failed", "error"); }
  }

  // UI Utils
  function navigate(page) {
    ["page-dashboard", "page-chat", "page-upload"].forEach(p => document.getElementById(p).classList.add("hidden"));
    ["nav-dashboard", "nav-chat", "nav-upload"].forEach(n => document.getElementById(n).classList.remove("active"));
    
    document.getElementById("page-" + page).classList.remove("hidden");
    document.getElementById("nav-" + page).classList.add("active");
    if(page === 'dashboard') loadDashboard();
  }

  function switchAuthTab(tab) {
    document.getElementById("login-form").classList.toggle("hidden", tab === 'register');
    document.getElementById("register-form").classList.toggle("hidden", tab === 'login');
    document.getElementById("tab-login").classList.toggle("active", tab === 'login');
    document.getElementById("tab-register").classList.toggle("active", tab === 'register');
  }

  function showToast(msg, type) {
    const container = document.getElementById("toast-container");
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.innerText = msg;
    container.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // Init
  if (token && currentUser) {
    document.getElementById("auth-screen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("sidebar-name").innerText = currentUser.name;
    document.getElementById("sidebar-major").innerText = currentUser.major;
    document.getElementById("sidebar-avatar").innerText = currentUser.name[0];
    loadDashboard();
  }
</script>
</body>
</html>
