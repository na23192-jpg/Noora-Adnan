<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus AUIS Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    body { background: #f8fafc; font-family: 'DM Sans', sans-serif; }
    .btn-navy { background: #1e3a8a; color: white; padding: 10px 20px; border-radius: 8px; }
  </style>
</head>
<body class="p-8">

  <div id="auth" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-4">Login to Nexus</h2>
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 mb-4 rounded">
    <input id="pass" type="password" placeholder="Password" class="w-full border p-2 mb-4 rounded">
    <button onclick="login()" class="btn-navy w-full">Sign In</button>
  </div>

  <div id="app" class="hidden grid grid-cols-12 gap-8">
    <div class="col-span-4 bg-white p-6 rounded-xl shadow">
      <h3 class="font-bold mb-4">Chat</h3>
      <div id="messages" class="h-64 overflow-y-auto mb-4 border-b"></div>
      <input id="msg-input" class="w-full border p-2 rounded" placeholder="Type...">
    </div>
    
    <div class="col-span-8 bg-white p-6 rounded-xl shadow">
      <h3 class="font-bold mb-4">Materials</h3>
      <div id="material-list" class="grid grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    const API = "https://noora-adnan.vercel.app/api";
    let user = null;

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('pass').value;
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        user = data.user;
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        initChat();
        loadMaterials();
      }
    }

    function initChat() {
      const pusher = new Pusher('c13e5901d85bfa53ba80', { cluster: 'mt1' });
      const channel = pusher.subscribe('general');
      channel.bind('new-message', data => {
        document.getElementById('messages').innerHTML += `<p><b>${data.userName}:</b> ${data.text}</p>`;
      });
    }

    async function loadMaterials() {
      const res = await fetch(`${API}/materials`);
      const data = await res.json();
      const list = document.getElementById('material-list');
      data.materials.forEach(m => {
        list.innerHTML += `<div class="border p-4 rounded"><b>${m.title}</b><br><a href="${m.fileUrl}" class="text-blue-500">Download</a></div>`;
      });
    }
  </script>
</body>
</html>
