<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AUIS — Academic Resource Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
  
  <style>
    /* YOUR ORIGINAL INTERFACE - DO NOT TOUCH */
    :root {
      --navy: #1e3a8a; --navy-dark: #162d6e; --navy-light: #2d4fa8;
      --slate: #64748b; --accent: #f59e0b; --bg: #f8fafc; --white: #ffffff;
      --border: #e2e8f0; --success: #10b981; --error: #ef4444;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #1e293b; }
    #sidebar { width: 260px; min-height: 100vh; background: var(--navy); position: fixed; left: 0; top: 0; z-index: 100; display: flex; flex-direction: column; }
    #main { margin-left: 260px; min-height: 100vh; padding: 32px; }
    .hidden { display: none !important; }
    .nav-item { padding: 10px 14px; cursor: pointer; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 10px; border-radius: 8px; }
    .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; }
    .auth-card { background: #fff; border-radius: 20px; width: 420px; box-shadow: 0 25px 80px rgba(0,0,0,0.3); overflow: hidden; }
    .material-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 18px; }
    /* (Adding your Toast and Chat styles back in) */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 14px 18px; border-radius: 10px; background: white; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border-left: 4px solid; animation: slideIn 0.3s ease; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--error); }
    @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
    .msg-bubble { display: flex; gap: 10px; margin-bottom: 12px; }
    .msg-bubble.mine { flex-direction: row-reverse; }
    .msg-text { background: #f1f5f9; padding: 10px; border-radius: 12px; max-width: 70%; }
    .msg-bubble.mine .msg-text { background: var(--navy); color: white; }
  </style>
</head>
<body>

<div id="toast-container"></div>

<div id="auth-screen" class="min-h-screen flex items-center justify-center bg-slate-900">
  <div class="auth-card">
    <div class="p-8 text-center bg-blue-900 text-white">
      <h2 class="text-2xl font-bold">Nexus <span class="text-amber-400">AUIS</span></h2>
    </div>
    <div class="p-8">
      <div class="flex border-b-2 mb-6">
        <button id="btn-login-tab" class="flex-1 py-2 font-bold border-b-2 border-blue-900" onclick="switchTab('login')">Login</button>
        <button id="btn-reg-tab" class="flex-1 py-2 text-slate-400" onclick="switchTab('register')">Register</button>
      </div>
      <div id="login-form">
        <input id="l-email" type="email" placeholder="Email" class="w-full p-3 border rounded mb-4">
        <input id="l-pass" type="password" placeholder="Password" class="w-full p-3 border rounded mb-4">
        <button onclick="login()" class="w-full bg-blue-900 text-white py-3 rounded font-bold hover:bg-blue-800">Sign In</button>
      </div>
      <div id="register-form" class="hidden">
        <input id="r-name" type="text" placeholder="Full Name" class="w-full p-3 border rounded mb-4">
        <input id="r-email" type="email" placeholder="Email" class="w-full p-3 border rounded mb-4">
        <input id="r-pass" type="password" placeholder="Password" class="w-full p-3 border rounded mb-4">
        <select id="r-major" class="w-full p-3 border rounded mb-4"><option>IT</option><option>Business</option><option>English</option></select>
        <button onclick="register()" class="w-full bg-blue-900 text-white py-3 rounded font-bold hover:bg-blue-800">Register</button>
      </div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="p-6 border-b border-white/10">
      <h1 class="text-white text-xl font-bold">Nexus <span class="text-amber-400">AUIS</span></h1>
    </div>
    <nav class="p-4 space-y-2">
      <div onclick="showPage('dashboard')" class="nav-item active" id="nav-dashboard">🏠 Dashboard</div>
      <div onclick="showPage('upload')" class="nav-item" id="nav-upload">⬆️ Upload</div>
      <div onclick="showPage('chat')" class="nav-item" id="nav-chat">💬 Live Chat</div>
      <div onclick="logout()" class="nav-item text-red-300 mt-10">↩ Logout</div>
    </nav>
  </div>

  <div id="main">
    <div id="page-dashboard">
      <h2 class="text-3xl font-bold mb-6">Community Resources</h2>
      <div id="materials-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="page-upload" class="hidden">
      <h2 class="text-3xl font-bold mb-6">Share Resource</h2>
      <div class="bg-white p-8 rounded-xl border max-w-lg">
        <div class="mb-4">
            <label class="block text-sm font-bold mb-2">Resource Title</label>
            <input id="up-title" type="text" class="w-full p-3 border rounded" placeholder="e.g. IT201 Summary">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-bold mb-2">Select File</label>
            <input id="up-file" type="file" class="w-full">
        </div>
        <button id="up-btn" onclick="uploadFile()" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold">Upload to Nexus Cloud</button>
      </div>
    </div>

    <div id="page-chat" class="hidden">
      <h2 class="text-3xl font-bold mb-4">AUIS Live Chat</h2>
      <div class="bg-white border rounded-xl flex flex-col h-[500px]">
        <div id="chat-messages" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-4 border-t flex gap-2">
            <input id="chat-input" type="text" placeholder="Type message..." class="flex-1 p-3 border rounded-lg">
            <button onclick="sendMsg()" class="bg-blue-900 text-white px-6 rounded-lg font-bold">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
    const API_URL = window.location.origin;
    let user = JSON.parse(localStorage.getItem('nexus_user'));

    // --- UTILS ---
    function toast(m, t='success') {
        const c = document.getElementById('toast-container');
        const d = document.createElement('div');
        d.className = `toast ${t}`;
        d.innerText = m;
        c.appendChild(d);
        setTimeout(() => d.remove(), 3000);
    }

    function switchTab(t) {
        document.getElementById('login-form').classList.toggle('hidden', t==='register');
        document.getElementById('register-form').classList.toggle('hidden', t==='login');
    }

    function showPage(p) {
        ['dashboard', 'upload', 'chat'].forEach(pg => document.getElementById(`page-${pg}`).classList.add('hidden'));
        document.getElementById(`page-${p}`).classList.remove('hidden');
        if(p === 'dashboard') loadMaterials();
    }

    // --- AUTH ---
    async function login() {
        const email = document.getElementById('l-email').value;
        const password = document.getElementById('l-pass').value;
        const res = await fetch(`${API_URL}/api/auth/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if(res.ok) {
            localStorage.setItem('nexus_user', JSON.stringify(data));
            location.reload();
        } else toast(data.message, 'error');
    }

    async function register() {
        const name = document.getElementById('r-name').value;
        const email = document.getElementById('r-email').value;
        const password = document.getElementById('r-pass').value;
        const major = document.getElementById('r-major').value;
        const res = await fetch(`${API_URL}/api/auth/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, email, password, major})
        });
        if(res.ok) { toast("Registered! Now Login."); switchTab('login'); }
    }

    // --- UPLOADTHING LOGIC ---
    async function uploadFile() {
        const file = document.getElementById('up-file').files[0];
        const title = document.getElementById('up-title').value;
        const btn = document.getElementById('up-btn');
        if(!file || !title) return toast("Missing title or file", "error");

        btn.disabled = true; btn.innerText = "Connecting to Cloud...";

        const fd = new FormData();
        fd.append('file', file);
        fd.append('title', title);
        fd.append('major', user.major);

        try {
            const res = await fetch(`${API_URL}/api/materials`, {
                method: 'POST',
                headers: {'Authorization': `Bearer ${user.token}`},
                body: fd
            });
            if(res.ok) { toast("Uploaded Successfully!"); showPage('dashboard'); }
            else toast("Upload Error", "error");
        } catch(e) { toast("Server Error", "error"); }
        finally { btn.disabled = false; btn.innerText = "Upload to Nexus Cloud"; }
    }
